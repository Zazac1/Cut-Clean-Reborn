name: CutCleanReborn
version: ${version}
main: fr.isaac.cutcleanreborn.paper.CutCleanRebornPlugin
api-version: '26.3'
description: CutCleanReborn Paper plugin.
authors: [Isaac]
commands:
  ccr:
    description: Configure CutCleanReborn or test its loading state.
    usage: /ccr <config|ping>
    aliases: [cutclean, crr]
  cleanstacks:
    description: Toggle your personal Clean Stacks conversion.
    usage: /cleanstacks <true|false>
permissions:
  cutcleanreborn.config:
    description: Allows opening and changing the CutCleanReborn configuration menu.
    default: op
