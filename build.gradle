plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}
ext.nativeSourceRoot = file('platform-fabric-modern').exists() ? file('platform-fabric-modern') : file('../platform-fabric-modern')
version = project.mod_version
group = 'fr.isaac.cutcleanreborn'
base { archivesName = 'cutcleanreborn' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation include('org.yaml:snakeyaml:2.5')
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets {
    main { java.srcDir layout.buildDirectory.dir('generated/ccrSources'); resources.srcDir new File(nativeSourceRoot, 'src/main/resources') }
    test { java.srcDir new File(nativeSourceRoot, 'src/test/java') }
}
loom { runs { server { runDir = 'build/manual-server'; programArg 'nogui' }; client { runDir = 'build/qa-client' } } }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand(version: project.version, minecraft_version: project.minecraft_version, java_version: '25') } }
jar { archiveFileName = "cutcleanreborn-${project.version}+${project.minecraft_family}.jar"; from('LICENSE') }
test { useJUnitPlatform() }
apply from: file('build-logic/fabric-modern-production.gradle').exists() ? file('build-logic/fabric-modern-production.gradle') : file('../build-logic/fabric-modern-production.gradle')



tasks.register('generateCommonSources', Sync) {
    from(new File(nativeSourceRoot, 'src/main/java'))
    into(layout.buildDirectory.dir('generated/ccrSources'))
    filteringCharset = 'UTF-8'
    filter { line -> line.replace('ClickType', 'ContainerInput') }
}
tasks.named('compileJava') { dependsOn('generateCommonSources') }
tasks.named('sourcesJar') { dependsOn('generateCommonSources') }



sourceSets {
    qa {
        java.srcDir layout.buildDirectory.dir('generated/ccrQaSources')
        resources.srcDir new File(nativeSourceRoot, 'src/qa/resources')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('generateQaSources',Sync) {
    from(new File(nativeSourceRoot, 'src/qa/java'))
    into(layout.buildDirectory.dir('generated/ccrQaSources'))
    filteringCharset='UTF-8'
    filter { line -> line.replace('ClickType', 'ContainerInput') }
}
tasks.named('compileQaJava'){ dependsOn('generateQaSources') }
loom {
    mods {
        cutcleanreborn { sourceSet sourceSets.main }
        ccrverification { sourceSet sourceSets.qa }
    }
    runs {
        smokeServer { server(); source sourceSets.qa; runDir='build/smoke-server'; programArg 'nogui'; vmArg '-Dccr.qa=true' }
    }
}
tasks.register('prepareSmokeServer',Copy){
    from(new File(nativeSourceRoot, 'src/qa/fixtures'))
    into(layout.buildDirectory.dir('smoke-server'))
    outputs.upToDateWhen { false }
    doFirst { delete layout.buildDirectory.file('smoke-server/ccr-qa-result.json') }
}
tasks.named('runSmokeServer') {
    dependsOn('qaClasses','prepareSmokeServer')
    maxHeapSize='768m'
    minHeapSize='128m'
    timeout=java.time.Duration.ofMinutes(5)
}
tasks.register('smokeTest'){
    group='verification'
    dependsOn('runSmokeServer')
    doLast {
        def result=layout.buildDirectory.file('smoke-server/ccr-qa-result.json').get().asFile
        if(!result.isFile())throw new GradleException('No Fabric native verification result')
        def report=new groovy.json.JsonSlurper().parse(result)
        if(report.counts.failed!=0)throw new GradleException("Native checks failed: ${report.failed}")
        logger.lifecycle("Fabric native verification: ${report.counts.passed} checks passed")
    }
}



tasks.register('prepareManualServer') {
    doLast {
        def destination=layout.buildDirectory.dir('manual-server').get().asFile
        destination.mkdirs()
        ['eula.txt','server.properties'].each { name ->
            if(!new File(destination,name).exists())copy { from(new File(nativeSourceRoot,'src/manual-fixtures/'+name)); into destination }
        }
    }
}
tasks.named('runServer') { dependsOn('prepareManualServer'); standardInput=System.in; maxHeapSize='1536m'; minHeapSize='128m' }
