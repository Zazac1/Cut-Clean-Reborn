name: CutCleanReborn
version: ${version}
main: fr.isaac.cutcleanreborn.bukkit.CutCleanRebornPlugin
api-version: '1.21.1'
description: CutCleanReborn Paper plugin.
authors: [Isaac]
commands:
  ccr:
    description: Open the configuration, view gameplay rules or reload settings.
    usage: /ccr [config|status|reload|help|ping]
    aliases: [cutclean, crr]
  cleanstacks:
    description: Toggle your personal Clean Stacks conversion.
    usage: /cleanstacks [on|off|status|true|false|toggle]
permissions:
  cutcleanreborn.config:
    description: Allows opening and changing the CutCleanReborn configuration menu.
    default: op

