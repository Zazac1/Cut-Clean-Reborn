// Launch the actual release JAR in the official Fabric server, never Loom classes.
def requireQaEula = {
    def localEula = new File(nativeSourceRoot, 'src/qa/fixtures/eula.txt')
    def agreement = new Properties()
    if (localEula.isFile()) localEula.withReader('UTF-8') { agreement.load(it) }
    if (!Boolean.parseBoolean(agreement.getProperty('eula', 'false'))) {
        throw new GradleException("Minecraft EULA must be accepted explicitly and locally before QA: read https://www.minecraft.net/eula, copy src/qa/fixtures/eula.example to ${localEula}, then edit it to eula=true only if you accept. No acceptance is generated by this build.")
    }
}
tasks.configureEach {
    if (name in ['prepareSmokeServer', 'prepareProductionServer', 'preparePersistenceServer']) {
        doFirst { requireQaEula() }
    }
}
configurations { productionFabricApi }
dependencies { productionFabricApi "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}" }
def obfuscated = project.minecraft_version.toString().startsWith('1.')
def releaseJar = tasks.named(obfuscated ? 'remapJar' : 'jar')
tasks.register('qaJar', Jar) {
    dependsOn('qaClasses')
    from sourceSets.qa.output
    archiveBaseName='ccrverification'
    archiveVersion="1.0.0+${project.minecraft_version}"
    archiveClassifier=obfuscated ? 'dev' : ''
}
if(obfuscated) {
    def remapType=Class.forName('net.fabricmc.loom.task.RemapJarTask',true,releaseJar.get().getClass().getClassLoader())
    tasks.register('remapQaJar',remapType) {
        dependsOn('qaJar')
        inputFile=tasks.named('qaJar',Jar).flatMap { it.archiveFile }
        archiveBaseName='ccrverification'
        archiveVersion="1.0.0+${project.minecraft_version}"
        archiveClassifier=''
    }
}
def qaReleaseJar=tasks.named(obfuscated ? 'remapQaJar' : 'qaJar')
def production=layout.buildDirectory.dir('smoke-server/production')
def officialLauncher=layout.buildDirectory.file('tools/fabric-server-launch.jar')
tasks.register('downloadProductionServer') {
    outputs.file(officialLauncher)
    doLast {
        def target=officialLauncher.get().asFile
        target.parentFile.mkdirs()
        new URI("https://meta.fabricmc.net/v2/versions/loader/${project.minecraft_version}/${project.loader_version}/1.1.2/server/jar").toURL().withInputStream { source -> target.withOutputStream { output -> output << source } }
    }
}
tasks.register('prepareProductionServer',Copy) {
    dependsOn(releaseJar,qaReleaseJar,'downloadProductionServer')
    from(new File(nativeSourceRoot,'src/qa/fixtures'))
    from(officialLauncher)
    into(production)
    outputs.upToDateWhen { false }
    doFirst { delete production.get().file('ccr-qa-result.json') }
    doLast {
        copy {
            from releaseJar.flatMap { it.archiveFile }
            from qaReleaseJar.flatMap { it.archiveFile }
            from configurations.productionFabricApi.resolvedConfiguration.resolvedArtifacts.find { it.moduleVersion.id.group=='net.fabricmc.fabric-api' && it.name=='fabric-api' }.file
            into production.get().dir('mods')
        }
    }
}
tasks.register('productionSmokeTest',Exec) {
    group='verification'
    dependsOn('prepareProductionServer')
    workingDir(production)
    timeout=java.time.Duration.ofMinutes(5)
    doFirst {
        executable=javaToolchains.launcherFor { languageVersion=java.toolchain.languageVersion.get() }.get().executablePath.asFile.absolutePath
        args '-Xms128M','-Xmx768M','-Dccr.qa=true','-jar','fabric-server-launch.jar','nogui'
    }
    doLast {
        def file=production.get().file('ccr-qa-result.json').asFile
        if(!file.isFile())throw new GradleException('Release JAR did not produce native verification report')
        def report=new groovy.json.JsonSlurper().parse(file)
        if(report.counts.failed!=0)throw new GradleException("Release JAR checks failed: ${report.failed}")
        logger.lifecycle("Actual Fabric release JAR: ${report.counts.passed} checks passed")
    }
}

// Independent world and three real JVMs: preserve state, remove it, then prove it stays removed.
def persistence=layout.buildDirectory.dir('smoke-server/persistence')
tasks.register('preparePersistenceServer',Copy) {
    dependsOn(releaseJar,qaReleaseJar,'downloadProductionServer')
    from(new File(nativeSourceRoot,'src/qa/fixtures'))
    from(officialLauncher)
    into(persistence)
    outputs.upToDateWhen { false }
    doFirst {
        ['write','read','reread'].each { stage -> delete persistence.get().file("cold-${stage}.json") }
    }
    doLast {
        copy {
            from releaseJar.flatMap { it.archiveFile }
            from qaReleaseJar.flatMap { it.archiveFile }
            from configurations.productionFabricApi.resolvedConfiguration.resolvedArtifacts.find { it.moduleVersion.id.group=='net.fabricmc.fabric-api' && it.name=='fabric-api' }.file
            into persistence.get().dir('mods')
        }
    }
}
def previousPersistence='preparePersistenceServer'
['write','read','reread'].each { stage ->
    def taskName='persistence'+stage.capitalize()
    def dependency=previousPersistence
    tasks.register(taskName,Exec) {
        dependsOn(dependency)
        workingDir(persistence)
        timeout=java.time.Duration.ofMinutes(5)
        doFirst {
            executable=javaToolchains.launcherFor { languageVersion=java.toolchain.languageVersion.get() }.get().executablePath.asFile.absolutePath
            args '-Xms128M','-Xmx768M','-Dccr.qa=true',"-Dccr.persistence=${stage}",'-jar','fabric-server-launch.jar','nogui'
        }
        doLast {
            def result=persistence.get().file("cold-${stage}.json").asFile
            if(!result.isFile())throw new GradleException("Missing cold restart ${stage} report")
            def report=new groovy.json.JsonSlurper().parse(result)
            if(report.counts.failed!=0)throw new GradleException("Cold restart ${stage} failed: ${report.failed}")
            def latestLog=persistence.get().file('logs/latest.log').asFile
            if(!latestLog.isFile())throw new GradleException("Cold restart ${stage}: missing server log")
            def logText=latestLog.getText('UTF-8')
            if(!['Stopping server','Saving worlds','Saving chunks'].every { logText.contains(it) })throw new GradleException("Cold restart ${stage}: clean shutdown/world save not confirmed")
            def archive=persistence.get().file("phase-${stage}.log").asFile
            archive.bytes=latestLog.bytes
            report.cleanShutdown=true
            report.logFile=archive.name
            result.text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report))
            logger.lifecycle("Actual Fabric cold restart ${stage}: ${report.counts.passed} checks passed")
        }
    }
    previousPersistence=taskName
}
tasks.register('productionPersistenceTest') {
    group='verification'
    dependsOn('persistenceReread')
    doLast {
        def reports=['write','read','reread'].collect { new groovy.json.JsonSlurper().parse(persistence.get().file("cold-${it}.json").asFile) }
        if(reports.collect { it.processId }.unique().size()!=3)throw new GradleException('Persistence verification did not use three different JVMs')
        def nonces=reports.collect { it.worldNonce }.unique()
        if(nonces.size()!=1 || !nonces.first())throw new GradleException('Cold restart reports do not identify the same native-NBT world nonce')
        def total=reports.sum { it.counts.passed }
        def report=[platform:'Fabric',minecraft:project.minecraft_version,worldNonce:nonces.first(),counts:[passed:total,failed:0],processIds:reports.collect { it.processId },stages:reports,realPlayerVisual:false]
        persistence.get().file('ccr-persistence-result.json').asFile.text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report))
        logger.lifecycle("Actual Fabric cold persistence: ${total} checks passed in three distinct JVMs")
    }
}
