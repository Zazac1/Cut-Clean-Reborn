name: Build

on:
  pull_request:
  push:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Paper 1.21.1
            directory: Paper_1.21.1
            java: '21'
          - platform: Paper 1.21.11
            directory: Paper_1.21.11
            java: '21'
          - platform: Paper 26.1.2
            directory: Paper_26.1.x
            java: '25'
          - platform: Paper 26.2
            directory: Paper_26.2
            java: '25'
          - platform: Paper 26.3
            directory: Paper_26.3
            java: '25'
          - platform: Purpur 1.21.1
            directory: Purpur_1.21.1
            java: '21'
          - platform: Purpur 1.21.11
            directory: Purpur_1.21.11
            java: '21'
          - platform: Purpur 26.1.2
            directory: Purpur_26.1.x
            java: '25'
          - platform: Purpur 26.2
            directory: Purpur_26.2
            java: '25'
          - platform: Purpur 26.3
            directory: Purpur_26.3
            java: '25'
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build
        working-directory: ${{ matrix.directory }}
        run: ./gradlew build
